name: rhone-arve-guru

x-application: &application
  build:
    context: .
    target: runtime
  environment:
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB:-rhone_arve}
    PGUSER: ${POSTGRES_USER:-rhone_arve}
    PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
  init: true

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhone_arve}
      POSTGRES_USER: ${POSTGRES_USER:-rhone_arve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *application
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3m
    restart: unless-stopped

volumes:
  postgres-data:
